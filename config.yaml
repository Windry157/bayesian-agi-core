app:
  debug: false
  name: Bayesian-AGI-Core
  version: 1.0.0

models:
  default: "gemma4:e4b"
  ollama_url: http://192.168.3.105:11434
  refresh_interval: 300
  routing_strategy: "round_robin"  # round_robin, random, least_response_time, cost_optimal, quality_first

  providers:
    ollama:
      enabled: true
      api_key: ""
      base_url: http://192.168.3.105:11434
      timeout: 60
      retry_attempts: 3
      models:
        - llama3.1:8b
        - qwen3.5:9b
        - gemma4:e4b
        - deepseek-coder-v2:16b
        - codellama:7b
        - fervent_mcclintock/Gemma-3-12B-Instruct:Q5_K_M
      costs:
        llama3.1:8b:
          input_cost_per_1k: 0.0  # 本地模型无成本
          output_cost_per_1k: 0.0
        qwen3.5:9b:
          input_cost_per_1k: 0.0
          output_cost_per_1k: 0.0

    openai:
      enabled: false
      api_key: "${OPENAI_API_KEY}"
      base_url: https://api.openai.com/v1
      timeout: 60
      retry_attempts: 3
      models:
        - gpt-3.5-turbo
        - gpt-4
        - gpt-4-turbo
      costs:
        gpt-3.5-turbo:
          input_cost_per_1k: 0.0005
          output_cost_per_1k: 0.0015
        gpt-4:
          input_cost_per_1k: 0.03
          output_cost_per_1k: 0.06

    anthropic:
      enabled: false
      api_key: "${ANTHROPIC_API_KEY}"
      base_url: https://api.anthropic.com
      timeout: 90
      retry_attempts: 3
      models:
        - claude-3-5-sonnet-20241022
        - claude-3-opus-20240229
        - claude-3-sonnet-20240229
        - claude-3-haiku-20240307
      costs:
        claude-3-5-sonnet-20241022:
          input_cost_per_1k: 0.003
          output_cost_per_1k: 0.015
        claude-3-opus-20240229:
          input_cost_per_1k: 0.015
          output_cost_per_1k: 0.075

    gemini:
      enabled: false
      api_key: "${GOOGLE_API_KEY}"
      base_url: https://generativelanguage.googleapis.com
      timeout: 60
      retry_attempts: 3
      models:
        - gemini-2.0-flash
        - gemini-1.5-flash
        - gemini-1.5-pro
      costs:
        gemini-2.0-flash:
          input_cost_per_1k: 0.0
          output_cost_per_1k: 0.0
        gemini-1.5-flash:
          input_cost_per_1k: 0.0
          output_cost_per_1k: 0.0
        gemini-1.5-pro:
          input_cost_per_1k: 0.00125
          output_cost_per_1k: 0.005

server:
  host: 0.0.0.0
  port: 8000
  workers: 4

memory:
  directory: memory
  vector_model: "ollama:nomic-embed-text"

feishu:
  enabled: true
  app_id: "cli_aa84898ed9389beb"
  app_secret: "LARK_APP_SECRET_PLACEHOLDER"
  encrypt_key: "FEISHU_ENCRYPT_KEY_PLACEHOLDER"
  verification_token: "FEISHU_VERIFICATION_TOKEN_PLACEHOLDER"

wechat:
  enabled: true
  app_id: "${WECHAT_APP_ID}"
  app_secret: "${WECHAT_APP_SECRET}"
  token: "${WECHAT_TOKEN}"
  encoding_aes_key: "${WECHAT_ENCODING_AES_KEY}"
  webhook_url: "/api/wechat/webhook"

websocket:
  auth_secret: "${WEBSOCKET_AUTH_SECRET:-your-secret-key-change-in-production}"
  timeout: 300
  max_connections: 1000

# =============================================================================
# 健壮性系统配置 (Resilience System Configuration)
# =============================================================================
resilience:
  # 熔断器配置
  circuit_breakers:
    ollama_service:
      enabled: true
      failure_threshold: 3
      recovery_timeout: 30
      expected_exceptions:
        - "ConnectionError"
        - "TimeoutError"
        - "Exception"
    llm_generation:
      enabled: true
      failure_threshold: 5
      recovery_timeout: 60
      expected_exceptions:
        - "Exception"
    external_api:
      enabled: true
      failure_threshold: 5
      recovery_timeout: 30
      expected_exceptions:
        - "Exception"
  
  # 限流器配置
  rate_limiters:
    api_global:
      enabled: true
      type: "sliding_window"
      requests: 1000
      period_seconds: 60
    per_user:
      enabled: true
      type: "token_bucket"
      requests: 60
      period_seconds: 60
      burst_size: 20
    per_ip:
      enabled: true
      type: "fixed_window"
      requests: 100
      period_seconds: 60
  
  # 日志配置
  logging:
    level: "INFO"
    json_format: true
    log_dir: "logs"
    max_file_size: 104857600  # 100MB
    backup_count: 10
    daily_rotation: true
  
  # 告警配置
  alerts:
    enabled: true
    circuit_breakers:
      max_open: 1  # 最多允许 1 个熔断器打开
      error_rate_threshold: 0.05  # 5% 错误率
    rate_limiting:
      reject_rate_threshold: 0.20  # 20% 拒绝率
  
  # 健康检查配置
  health:
    enabled: true
    check_interval_seconds: 30
    circuit_breaker_check: true
    rate_limiter_check: true
    model_availability_check: true

# 消息通道网关配置
gateway:
  host: "0.0.0.0"
  port: 8500
  debug: false
  engine_url: "http://localhost:8000"
  mcp_url: "http://localhost:8090/mcp"
  channels:
    telegram:
      enabled: false
      token: "${TELEGRAM_BOT_TOKEN}"
    websocket:
      enabled: true
      port: 8510
