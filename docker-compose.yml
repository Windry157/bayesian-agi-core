version: '3.8'

# =============================================================================
# 衡枢Agent (Bayesian-AGI-Core) Docker Compose
#
# ⚠️ 实际生产部署使用 hengshu-network 上的独立容器（通过 1Panel 管理）。
#    以下是用 docker compose 本地开发 / 测试的轻量配置。
#
# 生产环境实际运行的容器：
#   hengshu-agent (port 8000)  — 主应用 (uvicorn src.main:app)
#   hengshu-mcp    (port 8090)  — MCP 服务器 (uvicorn src.mcp_server:app)
#   hengshu-chroma (port 8001)  — ChromaDB 向量数据库
#   openai-bridge  (port 8003)  — OpenAI 兼容 API 桥接
#   hengshu-redis               — Redis 缓存
#   hengshu-nginx  (port 80)    — Nginx 反向代理
#   hengshu-grafana (port 3001) — Grafana 监控面板
#   hengshu-webui  (port 3000)  — Open WebUI
#   hengshu-prometheus (port 9090) — Prometheus 监控
#
# 消息通道通过 Hermes Agent (port 9119, 1Panel 管理) 处理，替代自建 message-gateway。
# =============================================================================

services:
  # 主应用 — 单体 FastAPI 服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # MCP 服务器 — 贝叶斯认知引擎
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    command: python -m uvicorn src.mcp_server:app --host 0.0.0.0 --port 8090

  # OpenAI 兼容桥接
  openai-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    command: python -m uvicorn openai_bridge:app --host 0.0.0.0 --port 8003
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434

  # ChromaDB 向量数据库
  chroma:
    image: chromadb/chroma:1.5.8-curl
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:v2.45.6
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana 监控面板
  grafana:
    image: grafana/grafana:10.4.13
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  chroma_data:
  prometheus_data:
