# CD Pipeline — 精简版
# 原模板依赖 staging 服务器 + SSH + Slack secrets，本项目环境不适用。
# 现仅作为 CI/CD Pipeline 完成后的状态标注，不做实际远端部署（部署在 3.105 手工/脚本管理）。
name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  status:
    name: Deployment Status (stub)
    runs-on: ubuntu-latest
    steps:
      - name: Report pipeline status
        run: |
          echo "CI/CD Pipeline 完成。"
          echo "本项目生产部署在 192.168.3.105 (手工/脚本管理)，不通过 GitHub Actions SSH 部署。"
          echo "如需自动部署，请配置 STAGING_HOST / SSH_USER / SSH_PRIVATE_KEY secrets 后启用。"
        continue-on-error: true