apiVersion: apps/v1
kind: Deployment
metadata:
  name: bayesian-agi-core
  namespace: default
  labels:
    app: bayesian-agi-core
    component: api
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bayesian-agi-core
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bayesian-agi-core
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/health/metrics"
    spec:
      containers:
        - name: bayesian-agi-core
          image: your-docker-username/bayesian-agi-core:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: OLLAMA_URL
              valueFrom:
                configMapKeyRef:
                  name: bayesian-agi-core-config
                  key: ollama_url
            - name: DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: bayesian-agi-core-config
                  key: default_model
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
      imagePullSecrets:
        - name: docker-registry-secret