apiVersion: v1
kind: Service
metadata:
  name: bayesian-agi-core-service
  namespace: default
  labels:
    app: bayesian-agi-core
    component: api
spec:
  type: ClusterIP
  selector:
    app: bayesian-agi-core
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  sessionAffinity: None