apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bayesian-agi-core-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.bayesian-agi-core.com
      secretName: bayesian-agi-core-tls
  rules:
    - host: api.bayesian-agi-core.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bayesian-agi-core-service
                port:
                  number: 80
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: bayesian-agi-core-service
                port:
                  number: 80
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: bayesian-agi-core-service
                port:
                  number: 80