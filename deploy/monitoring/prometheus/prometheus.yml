global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "openclaw-gateway"
    static_configs:
      - targets: ["192.168.3.105:18789"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "bayesian-mcp"
    static_configs:
      - targets: ["192.168.3.33:8090"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "ollama"
    static_configs:
      - targets: ["192.168.3.105:11434"]
    metrics_path: "/api/metrics"
    scrape_interval: 15s
